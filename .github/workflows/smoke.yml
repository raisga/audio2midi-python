name: Smoke tests

# Runs the installed CLI end to end with the real demucs and basic-pitch models.
# Slow (model downloads, CPU inference), so it only runs when the dependencies or
# the code wrapping them change, weekly to catch upstream breakage, or on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - pyproject.toml
      - src/audio2midi/core/**
      - src/audio2midi/pipeline.py
      - tests/test_smoke.py
      - .github/workflows/smoke.yml

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Real-model smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # The CPU build of torch avoids ~2 GB of CUDA wheels on the runner.
      - name: Install package
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install .

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: demucs-models-${{ hashFiles('tests/test_smoke.py') }}
          restore-keys: demucs-models-

      - name: Smoke tests
        run: make smoke
