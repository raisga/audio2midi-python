name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Unit tests mock demucs, basic-pitch and FFmpeg, so only click (and ruff) are needed.
      - name: Install test dependencies
        run: python -m pip install "click>=8.1" "ruff==0.17.4"

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test
