[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "a2m"
dynamic = ["version"]
description = "Split an audio file into its instrument tracks and convert each track to MIDI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jraleman" }]
# basic-pitch 0.4.0 requires tensorflow<2.15.1 on Python 3.11+, which has no wheels past 3.11.
requires-python = ">=3.10,<3.12"
dependencies = [
    "basic-pitch>=0.4,<0.5",
    "click>=8.1",
    "demucs>=4.1,<5",
    "onnxruntime>=1.17",
    "soundfile>=0.12",
    "torch>=2.1",
    # resampy (pinned <0.4.3 by basic-pitch) imports pkg_resources, removed in setuptools 81.
    "setuptools<81",
]
keywords = ["audio", "midi", "demucs", "basic-pitch", "stem-separation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]

[project.urls]
Homepage = "https://github.com/raisga/audio2midi-python"
Issues = "https://github.com/raisga/audio2midi-python/issues"

[project.optional-dependencies]
dev = ["build", "ruff==0.17.4", "twine"]

[project.scripts]
audio2midi = "audio2midi.cli:cli"
a2m = "audio2midi.cli:cli"

[tool.setuptools.dynamic]
version = { attr = "audio2midi.__version__" }

[tool.ruff]
line-length = 120
src = ["src", "tests"]
